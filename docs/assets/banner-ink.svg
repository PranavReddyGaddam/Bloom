<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 614" width="1536" height="614">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="120" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="reveal">
      <rect width="1536" height="614" fill="black"/>
      <circle cx="768" cy="307" r="0" fill="white" filter="url(#ink)">
        <animate attributeName="r" values="0;0;1100"
                 keyTimes="0;0.0909;1"
                 dur="11s" fill="freeze"
                 calcMode="spline" keySplines="0 0 1 1; 0.22 0.61 0.36 1"/>
      </circle>
    </mask>
  </defs>
  <image href="banner.png" width="1536" height="614" mask="url(#reveal)" preserveAspectRatio="xMidYMid slice"/>

</svg>